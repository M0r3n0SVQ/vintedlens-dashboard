name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # npm ci falla en este runner (aunque en local, tras regenerar
      # el lockfile, sí pasa): @tailwindcss/oxide-wasm32-wasi
      # empaqueta (bundleDependencies) versiones de @emnapi/* que la
      # validación estricta de `npm ci` no da por buenas en Linux. Es
      # un paquete opcional (fallback WASM que ni Windows ni Linux
      # x64 llegan a usar, porque ambos tienen binario nativo), así
      # que no afecta a qué se instala de verdad — `npm install` no
      # aplica esa misma validación estricta y evita el problema.
      - run: npm install

      - name: Lint (eslint)
        run: npm run lint

      # Sin paso de Typecheck aparte: tsc --noEmit en un checkout
      # limpio falla porque tsconfig.json incluye tipos que Next.js
      # solo genera al compilar (next-env.d.ts, .next/types/**),
      # como LayoutProps. `next build` ya tipa internamente (falla si
      # hay un error de tipos, no hace falta typescript.ignoreBuildErrors
      # en next.config.ts) — así que un paso de tsc suelto aquí sería
      # redundante y además rompería por un motivo que no es un error
      # real de tipos. `npm run typecheck` sigue existiendo para uso
      # local, donde next-env.d.ts ya existe de builds anteriores.
      #
      # force-dynamic evita que el build intente ejecutar el fetch a
      # la API real, así que no hace falta una VINTEDLENS_API_KEY de
      # verdad aquí — solo que las variables existan para que
      # process.env no dispare ninguna comprobación en build time.
      - name: Build
        run: npm run build
        env:
          VINTEDLENS_API_ENDPOINT: "https://example.invalid/"
          VINTEDLENS_API_KEY: "ci-placeholder"
